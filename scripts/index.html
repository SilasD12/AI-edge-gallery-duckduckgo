<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Web Research</title>
</head>
<body>
  <script>
    /**
     * Queries the DuckDuckGo Instant Answer API via JSONP.
     * JSONP uses a <script> tag instead of fetch(), bypassing CORS restrictions
     * in iOS WKWebView. DDG explicitly supports this via the ?callback= param.
     */
    function fetchDuckDuckGo(query) {
      return new Promise((resolve) => {
        const callbackName = 'ddg_' + Date.now();
        const script = document.createElement('script');

        const timeout = setTimeout(() => {
          delete window[callbackName];
          script.remove();
          console.warn('DuckDuckGo JSONP timeout');
          resolve(null);
        }, 8000);

        window[callbackName] = (d) => {
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();

          let out = '';
          if (d.Answer)       out += `Quick Answer: ${d.Answer}\n`;
          if (d.AbstractText) out += `Summary (${d.AbstractSource || 'DuckDuckGo'}): ${d.AbstractText}\n`;
          if (d.Definition)   out += `Definition (${d.DefinitionSource || 'DuckDuckGo'}): ${d.Definition}\n`;
          if (d.RelatedTopics?.length) {
            const topics = d.RelatedTopics
              .filter((t) => t.Text)
              .slice(0, 4)
              .map((t) => `  - ${t.Text}`)
              .join('\n');
            if (topics) out += `\nRelated:\n${topics}\n`;
          }

          resolve(out.trim() || null);
        };

        script.onerror = () => {
          clearTimeout(timeout);
          delete window[callbackName];
          console.warn('DuckDuckGo JSONP script load error');
          resolve(null);
        };

        script.src =
          'https://api.duckduckgo.com/?' +
          new URLSearchParams({
            q: query,
            format: 'json',
            no_html: '1',
            skip_disambig: '1',
            callback: callbackName,
          });

        document.head.appendChild(script);
      });
    }

    /**
     * Queries the Wikipedia API using fuzzy search.
     * Returns the article intro + infobox key-value pairs.
     * Uses origin=* for CORS compatibility in WKWebView.
     */
    async function fetchWikipedia(topic, lang) {
      const base = `https://${lang}.wikipedia.org/w/api.php`;

      // Step 1: Fuzzy search → article title + intro text
      const searchRes = await fetch(
        base + '?' + new URLSearchParams({
          action: 'query',
          format: 'json',
          generator: 'search',
          gsrsearch: topic,
          gsrlimit: '1',
          prop: 'extracts',
          explaintext: '1',
          exintro: '1',
          origin: '*',
        })
      );
      if (!searchRes.ok) throw new Error(`Wikipedia search HTTP ${searchRes.status}`);
      const searchData = await searchRes.json();
      if (!searchData.query?.pages) return null;

      const page = Object.values(searchData.query.pages)[0];
      const title = page?.title || topic;
      const extract = page?.extract || '';

      // Step 2: Fetch Section 0 HTML to extract infobox key/value pairs
      let infoboxText = '';
      try {
        const parseRes = await fetch(
          base + '?' + new URLSearchParams({
            action: 'parse',
            page: title,
            section: '0',
            prop: 'text',
            format: 'json',
            origin: '*',
          })
        );
        const parseData = await parseRes.json();
        const html = parseData?.parse?.text?.['*'];
        if (html) {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const infobox = doc.querySelector('table.infobox');
          if (infobox) {
            infobox.querySelectorAll('tr').forEach((row) => {
              const th = row.querySelector('th');
              const td = row.querySelector('td');
              if (th && td) {
                const key = th.textContent.replace(/\[\d+\]/g, '').trim();
                const val = td.textContent.replace(/\[\d+\]/g, '').trim().replace(/\n+/g, ' | ');
                infoboxText += `${key}: ${val}\n`;
              }
            });
          }
        }
      } catch (e) {
        console.warn('Infobox parse failed:', e.message);
      }

      // Step 3: Assemble and cap length to protect context window
      let combined = '';
      if (infoboxText) combined += `--- INFOBOX: ${title} ---\n${infoboxText}\n`;
      if (extract)     combined += `--- INTRO ---\n${extract}`;

      const maxChars = lang === 'zh' ? 1500 : 4500;
      if (combined.length > maxChars) {
        combined = combined.substring(0, maxChars) + '\n... [truncated to save context]';
      }

      return combined.trim() ? { title, content: combined } : null;
    }

    /**
     * Main entry point called by the AI Edge Gallery app.
     * Runs DuckDuckGo (JSONP) and Wikipedia in parallel, then combines results.
     */
    window['ai_edge_gallery_get_result'] = async (data) => {
      try {
        const { query, topic, lang = 'en' } = JSON.parse(data);

        if (!query && !topic) {
          return JSON.stringify({ error: 'Missing required fields: provide at least "query" or "topic".' });
        }

        const [ddg, wiki] = await Promise.all([
          fetchDuckDuckGo(query || topic),
          fetchWikipedia(topic || query, lang),
        ]);

        const sections = [];
        const sources = [];

        if (ddg) {
          sections.push(`=== DUCKDUCKGO INSTANT ANSWER ===\n${ddg}`);
          sources.push('DuckDuckGo');
        }
        if (wiki) {
          sections.push(`=== WIKIPEDIA: ${wiki.title} ===\n${wiki.content}`);
          sources.push(`Wikipedia ("${wiki.title}")`);
        }

        if (sections.length === 0) {
          return JSON.stringify({
            error: `No results found for "${query || topic}". Try a shorter or more specific keyword.`,
          });
        }

        return JSON.stringify({
          result: sections.join('\n\n') + `\n\n[Sources: ${sources.join(', ')}]`,
        });
      } catch (e) {
        console.error('deep-web-research error:', e);
        return JSON.stringify({ error: `Research failed: ${e.message}` });
      }
    };
  </script>
</body>
</html>
