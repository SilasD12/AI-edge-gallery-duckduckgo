<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Web Research</title>
</head>
<body>
  <script>
    /**
     * Searches Wikipedia and returns the article intro + infobox key-value pairs.
     * Uses origin=* for CORS compatibility in WKWebView.
     */
    async function fetchWikipedia(topic, lang) {
      const base = `https://${lang}.wikipedia.org/w/api.php`;

      // Step 1: Fuzzy search → article title + intro text
      const searchRes = await fetch(
        base + '?' + new URLSearchParams({
          action: 'query',
          format: 'json',
          generator: 'search',
          gsrsearch: topic,
          gsrlimit: '1',
          prop: 'extracts',
          explaintext: '1',
          exintro: '1',
          origin: '*',
        })
      );
      if (!searchRes.ok) throw new Error(`Wikipedia search HTTP ${searchRes.status}`);
      const searchData = await searchRes.json();
      if (!searchData.query?.pages) return null;

      const page = Object.values(searchData.query.pages)[0];
      const title = page?.title || topic;
      const extract = page?.extract || '';

      // Step 2: Fetch Section 0 HTML to extract infobox key/value pairs
      let infoboxText = '';
      try {
        const parseRes = await fetch(
          base + '?' + new URLSearchParams({
            action: 'parse',
            page: title,
            section: '0',
            prop: 'text',
            format: 'json',
            origin: '*',
          })
        );
        const parseData = await parseRes.json();
        const html = parseData?.parse?.text?.['*'];
        if (html) {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const infobox = doc.querySelector('table.infobox');
          if (infobox) {
            infobox.querySelectorAll('tr').forEach((row) => {
              const th = row.querySelector('th');
              const td = row.querySelector('td');
              if (th && td) {
                const key = th.textContent.replace(/\[\d+\]/g, '').trim();
                const val = td.textContent.replace(/\[\d+\]/g, '').trim().replace(/\n+/g, ' | ');
                infoboxText += `${key}: ${val}\n`;
              }
            });
          }
        }
      } catch (e) {
        console.warn('Infobox parse failed:', e.message);
      }

      // Step 3: Assemble and cap length to protect context window
      let combined = '';
      if (infoboxText) combined += `--- INFOBOX: ${title} ---\n${infoboxText}\n`;
      if (extract)     combined += `--- INTRO ---\n${extract}`;

      const maxChars = lang === 'zh' ? 1500 : 4500;
      if (combined.length > maxChars) {
        combined = combined.substring(0, maxChars) + '\n... [truncated to save context]';
      }

      return combined.trim() ? { title, content: combined } : null;
    }

    /**
     * Main entry point called by the AI Edge Gallery app.
     */
    window['ai_edge_gallery_get_result'] = async (data) => {
      try {
        const { query, topic, lang = 'en' } = JSON.parse(data);
        const searchTerm = topic || query;

        if (!searchTerm) {
          return JSON.stringify({ error: 'Missing required fields: provide at least "query" or "topic".' });
        }

        const wiki = await fetchWikipedia(searchTerm, lang);

        if (!wiki) {
          return JSON.stringify({
            error: `No Wikipedia results found for "${searchTerm}". Try a shorter or more specific keyword.`,
          });
        }

        return JSON.stringify({
          result: `=== WIKIPEDIA: ${wiki.title} ===\n${wiki.content}\n\n[Source: Wikipedia ("${wiki.title}")]`,
        });
      } catch (e) {
        console.error('deep-web-research error:', e);
        return JSON.stringify({ error: `Research failed: ${e.message}` });
      }
    };
  </script>
</body>
</html>
